<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles/vendor_nav.css">
  <link rel="stylesheet" href="./styles/vendor_dashboard.css">
  <link rel="stylesheet" href="./styles/vendor_notifications.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications</title>
</head>

<body>

  <div id="nav-container"></div>

  <div class="dashboard-container">

    <!-- Left -->
    <section class="notifications-container">
      <div class="header">
        <h2>Notifications</h2>
        <p>View and manage your latest notifications.</p>
      </div>

      <div class="notification-list" id="notifications"></div>


      <div id="empty-message" style="display:none;">
        <p>No notifications.</p>
      </div>
    </section>

    <!-- Right -->
    <section class="orders-container">
      <div class="orders-header">
        <div class="header">
          <h2>Orders</h2>
          <p>Manage orders for your stall.</p>
        </div>

        <div class="pending-counter">
          <span>Pending</span>
          <strong id="pending-count">0</strong>
        </div>
      </div>

      <div class="orders-list" id="orders-list"></div>


      <div id="empty-orders" style="display:none;">
        <p>No orders found.</p>
      </div>
    </section>

  </div>

<script src="scripts/vendor/vendor_nav.js"></script>
  <script type="module" src="scripts/vendor_js/vendor_notifications.js"></script>
  <script type="module" src="scripts/vendor_js/vendor_orderlist.js"></script>
</body>
</html>
