<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles/vendor_menu.css">
  <link rel="stylesheet" href="./styles/vendor_nav.css">
  <link rel="stylesheet" href="./styles/vendor_dashboard.css">
  <title>Menu Management</title>
</head>
<body>
  <div id="nav-container"></div>
  <div id="menu"></div>
  <main class="container vendor-page">
    <!-- Header -->
    <div class="header">
      <div>
        <h2>Menu Management</h2>
        <p>Manage your menu items, pricing, and availability</p>
      </div>
      <button id="addMenuButton" class="btn btn-primary" type="button">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v14M5 12h14"></path>
        </svg>
        Add Menu Item
      </button>
    </div>

    <!-- Store Info Banner -->
    <div class="card banner-card">
      <div class="card-content">
        <div class="banner-content">
          <div class="banner-icon">
            <img src="./icons/home/main-dish.svg" alt="">
          </div>
          <div>
            <h3 id="vendorStallName" class="banner-title">Your vendor menu</h3>
            <p id="vendorStallDetails" class="banner-subtitle">Loading stall information...</p>
          </div>
        </div>
      </div>
    </div>

    <p id="menuMessage" class="menu-message" role="status">Loading menu items...</p>

    <!-- Search and filters follow the existing vendor dashboard pattern. -->
    <div class="menu-toolbar" aria-label="Menu filters">
      <label class="toolbar-field toolbar-search">
        <span>Search menu</span>
        <input id="menuSearch" type="search" placeholder="Search by item name or category">
      </label>

      <label class="toolbar-field">
        <span>Stall</span>
        <select id="stallFilter">
          <option value="all">All stalls</option>
        </select>
      </label>

      <label class="toolbar-field">
        <span>Cuisine</span>
        <select id="cuisineFilter">
          <option value="all">All cuisines</option>
        </select>
      </label>
    </div>

    <!-- Menu Items by Category -->
    <div id="menu-categories"></div>

    <!-- Quick Stats -->
    <div class="grid-stats" id="stats-grid"></div>
  </main>

  <script src="./scripts/vendor/vendor_menu.js" defer></script>
  <script src="./scripts/vendor/vendor_nav.js" defer></script>
</body>
</html>
