<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles/main.css">
  <link rel="stylesheet" href="./styles/vendor_nav.css">
  <link rel="stylesheet" href="./styles/vendor_dashboard.css">

  <title>Vendor Profile</title>
</head>

<body>
<div id="nav-container"></div>

<main class="container vendor-page">
<section class="profile-section">
<h2>My Profile</h2>

<div id="profileMessage" class="form-message"></div>

<div class="profile-card">

  <!-- USERNAME -->
  <div class="profile-row">
    <span class="label">Username</span>
    <span class="value" id="profileUsername"></span>
    <button class="btn-pill" data-edit="username" type="button">Edit</button>
  </div>

  <!-- EMAIL -->
  <div class="profile-row">
    <span class="label">Email</span>
    <span class="value" id="profileEmail"></span>
    <button class="btn-pill" data-edit="email" type="button">Edit</button>
  </div>

  <!-- ROLE (read only) -->
  <div class="profile-row">
    <span class="label">Account Type</span>
    <span class="value" id="profileRole"></span>
  </div>

  <!-- PASSWORD -->
  <div class="profile-row">
    <span class="label">Password</span>
    <span class="value">••••••••</span>
    <button id="editPasswordBtn" class="btn-pill" type="button">Change</button>
  </div>

  <!-- GENERAL EDITOR (username / email) -->
  <div id="editor" class="edit-panel" style="display:none;">
    <label id="editLabel" for="editInput">New value</label>
    <input id="editInput" class="input" type="text">
    <div class="edit-actions">
      <button id="saveEditBtn" class="btn" type="button">Save</button>
      <button id="cancelEditBtn" class="btn btn-outline" type="button">Cancel</button>
    </div>
  </div>

  <!-- PASSWORD EDITOR -->
  <div id="passwordEdit" class="edit-panel" style="display:none;">
    <label for="currentPassword">Current password</label>
    <input id="currentPassword" class="input" type="password" autocomplete="current-password">

    <label for="newPassword">New password</label>
    <input id="newPassword" class="input" type="password" autocomplete="new-password">

    <label for="confirmPassword">Confirm new password</label>
    <input id="confirmPassword" class="input" type="password" autocomplete="new-password">

    <ul class="password-checklist" id="passwordChecklist">
      <li id="checkLength" data-label="At least 8 characters">At least 8 characters</li>
      <li id="checkUpper" data-label="One uppercase letter">One uppercase letter</li>
      <li id="checkLower" data-label="One lowercase letter">One lowercase letter</li>
      <li id="checkNumber" data-label="One number">One number</li>
      <li id="checkMatch" data-label="Both new passwords match">Both new passwords match</li>
    </ul>

    <div class="edit-actions">
      <button id="savePasswordBtn" class="btn" type="button">Save Password</button>
      <button id="cancelPasswordBtn" class="btn btn-outline" type="button">Cancel</button>
    </div>
  </div>

  <button id="logoutBtn" class="primary-btn" type="button">Logout</button>

  <!-- DANGER ZONE -->
  <div class="danger-zone">
    <h3>Delete Account</h3>
    <p>Deleting your account is permanent and cannot be undone.</p>
    <button id="deleteAccountBtn" class="btn-danger" type="button">Delete My Account</button>
  </div>

</div>
</section>
</main>

<script src="./scripts/vendor/vendor_nav.js"></script>
<script type="module" src="./scripts/js-login/user.js"></script>
</body>
</html>
