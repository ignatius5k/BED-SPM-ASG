<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles/vendor_agreements.css">
  <link rel="stylesheet" href="./styles/vendor_nav.css">
  <link rel="stylesheet" href="./styles/vendor_dashboard.css">
  <title>Documents & Agreements</title>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div id="nav-container"></div>
  <main class="container vendor-page">
    <div class="header">
  <div>
    <h2>Documents & Agreements</h2>
    <p>Manage your licenses, certificates, and legal documents</p>
  </div>
  <button class="btn btn-primary" onclick="addNewAgreement()">
    <i data-lucide="plus" class="icon"></i>
    Add Agreement
  </button>
</div>

    <div class="grid" id="documents-grid"></div>

    <div class="alert-card">
      <div class="alert-content">
        <i data-lucide="alert-circle" class="icon icon-alert"></i>
        <div>
          <h3 class="alert-title">Document Compliance Reminder</h3>
          <p class="alert-description">
            Ensure all documents are valid and up-to-date to maintain your operating license. 
            Documents expiring within 30 days will be flagged for renewal.
          </p>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="./scripts/kishore_js/vendor_agreements.js"></script>
  <script src="./scripts/kishore_js/vendor_nav.js"></script>
  <script>
  lucide.createIcons();
</script>
</body>
</html>
