<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hawkers | Login</title>
  
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles/main.css">

</head>
<body>
  <div class="container">
    <div class="auth-shell">
      <section class="card">
        <div class="brand-row">
          <div class="brand-mark">
<svg width="26" height="26" viewBox="0 0 64 64" aria-hidden="true">
  <path d="M14 34c2 10 10 18 18 18s16-8 18-18H14z" fill="#e8e8e8" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M12 34h40" stroke="#1a1a1a" stroke-width="2" />
  <path d="M22 18c0 5-4 5-4 10" stroke="#f08a24" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M34 18c0 5-4 5-4 10" stroke="#f08a24" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M46 18c0 5-4 5-4 10" stroke="#f08a24" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
</div>
          <h1 class="brand-name">Hawkers</h1>
        </div>

        <h2 class="form-title">Welcome Back!</h2>
        <p class="brand-subtitle">Sign in to your account to continue.</p>

        <form class="form" data-role="login">
          <label for="email">Email Address</label>
          <input id="email" class="input" type="email" placeholder="Enter your email address" autocomplete="email" required>

          <label for="password">Password</label>
          <input id="password" class="input" type="password" placeholder="Enter your password" autocomplete="current-password" required>

          <button id="btnPrimary" class="btn" type="button">Sign In</button>

          <button id="btnGuest" class="btn btn-outline" type="button">
            Continue as Guest
          </button>

          <div class="links">
            <div>Don't have an account? <a href="./signup.html">Sign Up</a></div>
          </div>
        </form>
      </section>
      
      <section class="photo-grid" aria-label="Photo collage">
        <div class="photo tall"><img src="./user_pages/city.jpg" alt="Street scene"></div>
        <div class="photo-stack">
          <div class="photo"><img src="./user_pages/hawker.jpg" alt="Hawker stall scene"></div>
          <div class="photo wide"><img src="./user_pages/city.jpg" alt="Singapore skyline"></div>
        </div>
      </section>

    </div>
  </div>

  <script type="module" src="./scripts/js-login/page-auth-bindings.js"></script>
  <script type="module" src="./scripts/js-login/navigation.js"></script>
</body>
</html>
