<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inspection Analysis</title>
<link rel="stylesheet" href="css/inspection-analysis.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="container">

<h1>Inspection Analysis Dashboard</h1>

<div class="cards">

<div class="card">
<h2 id="totalInspection">0</h2>
<p>Total Inspections</p>
</div>

<div class="card">
<h2 id="averageScore">0</h2>
<p>Average Score</p>
</div>

<div class="card">
<h2 id="gradeA">0</h2>
<p>Grade A</p>
</div>

<div class="card">
<h2 id="openIssues">0</h2>
<p>Open Issues</p>
</div>

</div>

<div class="chart-container">
<h3>Inspection Score Trend</h3>
<canvas id="scoreChart"></canvas>
</div>

<div class="chart-container">
<h3>Hygiene Grade Distribution</h3>
<canvas id="gradeChart"></canvas>
</div>

<div class="table-container">

<h3>Recent Inspections</h3>

<table>

<thead>
<tr>
<th>Stall</th>
<th>Inspector</th>
<th>Score</th>
<th>Grade</th>
<th>Date</th>
</tr>
</thead>

<tbody id="inspectionTable"></tbody>

</table>

</div>

</div>

<script src="js/inspection-analysis.js"></script>

</body>
</html>
